services:
  - type: worker
    name: neon-casino
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m neon_casino
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: data/neon_casino.db
    disk:
      name: neon-casino-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1